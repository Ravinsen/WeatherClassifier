<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weather Classification</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f9f9f9;
            font-family: "Segoe UI", sans-serif;
        }
        .dropzone {
            border: 2px dashed #ccc;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            background-color: #fff;
            cursor: pointer;
        }
        .dropzone.dragover {
            border-color: #0d6efd;
            background-color: #f0f8ff;
        }
        #preview {
            max-width: 200px;
            margin-top: 15px;
            display: none;
        }
        .result-box {
            margin-top: 30px;
            padding: 20px;
            border-radius: 10px;
            background-color: #d1e7dd;
        }
    </style>
</head>
<body class="container py-5">

    <h2 class="text-center mb-4">🌤️ Weather Classification</h2>

    <!-- Drag & Drop Zone -->
    <div id="dropzone" class="dropzone mb-3">
        <p>Drag & drop an image here or click to select one</p>
        <input type="file" id="fileInput" name="image" accept="image/*" hidden>
        <img id="preview" class="img-fluid rounded" />
    </div>

    <div class="text-center">
        <button id="submitBtn" class="btn btn-primary" disabled>Analyze Image</button>
    </div>

    <div id="result" class="text-center result-box mt-4 d-none">
        <h4 class="fw-bold" id="predictionText"></h4>
        <p id="confidenceText" class="mb-0"></p>
    </div>

    <script>
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');
        const preview = document.getElementById('preview');
        const submitBtn = document.getElementById('submitBtn');
        let selectedFile;

        dropzone.addEventListener('click', () => fileInput.click());

        dropzone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropzone.classList.add('dragover');
        });

        dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));

        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            handleFile(file);
        });

        fileInput.addEventListener('change', () => {
            const file = fileInput.files[0];
            handleFile(file);
        });

        function handleFile(file) {
            if (!file || !file.type.startsWith('image/')) return;

            selectedFile = file;
            const reader = new FileReader();
            reader.onload = (e) => {
                preview.src = e.target.result;
                preview.style.display = 'block';
            };
            reader.readAsDataURL(file);
            submitBtn.disabled = false;
        }

        submitBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            const formData = new FormData();
            formData.append("image", selectedFile);

            const response = await fetch("/analyze", {
                method: "POST",
                body: formData
            });

            const data = await response.json();
            document.getElementById('predictionText').innerHTML = data.wetter;
            document.getElementById('confidenceText').textContent = "Confidence: " + data.confidence;
            document.getElementById('result').classList.remove('d-none');
        });
    </script>

</body>
</html>
